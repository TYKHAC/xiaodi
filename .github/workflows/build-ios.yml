name: 构建 小弟（iOS App）

# 用户没有 Mac ⇒ 用 GitHub Actions 的免费 macOS runner 编译。
# 公开仓库的 Actions 完全免费（私有仓库 macOS 有 10 倍计费，公开没有）。
on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
  workflow_dispatch:   # 手动触发：在网页上点一下 Run

jobs:
  build:
    # macos-15 是 Apple Silicon，dsh-mobile 的 KMP framework 需要
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        # 必须用 Xcode 26（本项目用了 iOS 26 SDK 的新 API：
        # .glassEffect / ToolbarSpacer / buttonSizing 等，这些在 18.x SDK 里不存在）。
        # macos-15 镜像同时装了 26.0.1 / 26.1.1 / 26.2 / 26.3，取最高可用版本。
        # 找不到 26 就直接失败 —— 用低版本编会报一堆"no member"的假错误，白烧额度。
        run: |
          set -euo pipefail
          for v in 26.3 26.2 26.1.1 26.0.1; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app"
              echo "::notice::using Xcode ${v}"
              break
            fi
          done
          xcodebuild -version
          echo "--- iphoneos SDKs available ---"
          xcodebuild -showsdks | grep -i "iOS [0-9]" || true

      - name: 缓存 Gradle（KMP 要编 framework，缓存能省 10+ 分钟）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/Library/Caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 装 Java 17（KMP framework 构建需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成工程所需的依赖
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Dump 工程结构（排查用）
        run: |
          {
            echo "===== xcodebuild -version ====="
            xcodebuild -version
            echo "===== SDKs ====="
            xcodebuild -showsdks
            echo "===== list -project schemes ====="
            xcodebuild -list -project DeepSeekHarnessMobile.xcodeproj
            echo "===== targets ====="
            xcodebuild -list -project DeepSeekHarnessMobile.xcodeproj -json || true
          } 2>&1 | tee project-info.log || true
          cat project-info.log

      - name: 上传工程结构
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-info
          path: project-info.log
          retention-days: 14
          if-no-files-found: ignore

      # 注意：Xcode 工程里已有一个「Build KMP Framework」构建阶段
      #（PBXShellScriptBuildPhase，project.pbxproj L481），它自己会按
      # $CONFIGURATION / $PLATFORM_NAME / $ARCHS 决定 Debug|Release 与
      # IosArm64|IosSimulatorArm64，并调用
      #   gradlew :shared:link${KMP_BUILD_TYPE}Framework${KMP_TARGET}
      # 所以这里**不要**再手动 link 一次 —— 会先编 Debug 再被 Release 覆盖，
      # 白费十几分钟，KMP 模块的 .a 还会出现两套混用的风险。
      - name: 编译 App（不出签名，产出未签名 .app）
        # tee + pipefail：完整日志落盘成 xcodebuild.log，
        # 失败时通过 upload-artifact 传回来看（控制台只留摘要，定位不到具体行）。
        run: |
          set -o pipefail
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee xcodebuild.log

      - name: 上传编译日志（失败时用来定位）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore

      - name: 打包成可侧载的 .ipa
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          # 没找到 .app 必须显式失败：否则 zip 会打出一个空壳 ipa，
          # 到了手机上才炸，白等一轮下载。
          if [ -z "$APP" ]; then
            echo "::error::Release-iphoneos 下没有 .app，编译其实没成功或产物路径变了"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          echo "找到 app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 不带 _CodeSignature 目录，否则 AltStore 侧载会因签名不匹配失败
          rm -rf "Payload/$(basename "$APP")/_CodeSignature"
          zip -qry xiaodi-unsigned.ipa Payload
          rm -rf Payload
          ls -la xiaodi-unsigned.ipa

      # ── 朱小姐：视觉自查（Agent 看得见手机效果）──────────────────────
      # Agent 没有真机，浅色白字这类问题只能靠截图自查。用模拟器把 App
      # 跑起来截首页（浅/深两套），截图作为 artifact 回传给 Agent 直接看。
      # ipa 不受影响：模拟器版走 iphonesimulator SDK，不进 ipa。
      # continue-on-error：模拟器环节挂了也不影响出包。
      - name: 编译模拟器版（截图用）
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-sim.log

      - name: 模拟器截图（浅色/深色 首页）
        continue-on-error: true
        run: |
          set -x
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; devs=[d for ds in json.load(sys.stdin)['devices'].values() for d in ds if 'iPhone' in d['name']]; print(devs[-1]['udid'] if devs else '')")
          echo "Using simulator: $UDID"
          if [ -z "$UDID" ]; then echo "::notice::no iPhone simulator available"; exit 0; fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::notice::simulator .app not found"; exit 0; fi
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "bundle: $BUNDLE"
          # 浅色首页（冷启动后多等一会，过掉启动屏）
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 12
          xcrun simctl io "$UDID" screenshot shots/home-light.png
          # 深色首页（同一实例切外观即可）
          xcrun simctl ui "$UDID" appearance dark
          sleep 4
          xcrun simctl io "$UDID" screenshot shots/home-dark.png
          # 设置页（RootView 的 ZXJ_SHOT 钩子直接路由过去）
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          xcrun simctl ui "$UDID" appearance light
          SIMCTL_CHILD_ZXJ_SHOT=settings xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/settings-light.png
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          xcrun simctl shutdown "$UDID" || true
          ls -la shots/

      - name: 上传截图（Agent 自查视觉用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 14
          if-no-files-found: ignore

      - name: 上传模拟器编译日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-sim-log
          path: xcodebuild-sim.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传 ipa（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: xiaodi-unsigned-ipa
          path: xiaodi-unsigned.ipa
          retention-days: 30

      - name: 上传为 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: xiaodi-unsigned.ipa
